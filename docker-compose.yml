services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    depends_on:
      - cadvisor
  cadvisor:
    image: google/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - 8181:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
  pushgateway:
    image: prom/pushgateway
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - 9091:9091
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    expose:
      - 9100
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-password}
    depends_on:
      - prometheus
      - cadvisor
  smokeping-prober:
    image: quay.io/superq/smokeping-prober:latest
    container_name: smokeping-prober
    privileged: true
    restart: unless-stopped
    ports:
      - 9374:9374
    entrypoint: ["sh", "-c"]
    command:
      - >-
        smokeping_prober
        --privileged
        --ping.interval=${PING_INTERVAL:-0.2s}
        --buckets=0.005,0.01,0.015,0.02,0.025,0.03,0.035,0.04,0.045,0.05,0.055,0.06,0.065,0.07,0.075,0.08,0.085,0.09,0.095,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5,1.0
        ${TARGETS:-1.1.1.1 8.8.8.8}

  setup:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: Dockerfile.setup
    volumes:
      - .:/work
    environment:
      - TARGETS=${TARGETS:-1.1.1.1 8.8.8.8}
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_PASSWORD=${GF_ADMIN_PASSWORD:-password}
    depends_on:
      - grafana

volumes:
  grafana-storage:
  prometheus-storage:
